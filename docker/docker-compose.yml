services:
  postgres:
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: tawqi
      POSTGRES_USER: tawqi
      POSTGRES_PASSWORD: tawqi
    volumes:
      - pgdata:/var/lib/postgresql/data

  vault:
    image: hashicorp/vault:latest
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - ./vault:/vault/config

volumes:
  pgdata:
